  <script>
    'use strict';

    /* ★ CONFIGURAÇÕES */
    const RESPOSTA_CERTA = 'carbonara';
    const MINUTOS_ABERTA = 10;   // tempo que a carta fica disponível depois de aberta

    const CHAVE_INICIO = 'cartaNova.inicio';    // quando ela entrou
    const CHAVE_FIM    = 'cartaNova.encerrada'; // tempo acabou
    const DURACAO_MS   = MINUTOS_ABERTA * 60 * 1000;

    // localStorage pode falhar (ex.: modo restrito); nesse caso segue sem gravar
    function ler(chave) {
      try { return localStorage.getItem(chave); } catch (e) { return null; }
    }
    function gravar(chave, valor) {
      try { localStorage.setItem(chave, valor); } catch (e) {}
    }

    // "Carbonara ", "CARBONARÁ" etc. contam como certo
    function normalizar(txt) {
      return txt.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function encerrar() {
      gravar(CHAVE_FIM, '1');
      document.getElementById('carta').remove();
      document.getElementById('conteudo-carta').remove();
      document.getElementById('pergunta').remove();
      document.title = '';
      document.body.className = 'encerrado';
    }

    function abrirCarta(inicio) {
      const carta  = document.getElementById('carta');
      const modelo = document.getElementById('conteudo-carta');

      document.getElementById('pergunta').hidden = true;
      carta.appendChild(modelo.content.cloneNode(true));
      carta.hidden = false;
      window.scrollTo(0, 0);

      // Sem relógio na tela: quando o tempo acaba, a carta apaga sozinha
      const resta = Math.max(0, DURACAO_MS - (Date.now() - inicio));
      setTimeout(() => {
        carta.classList.add('apagando');
        setTimeout(encerrar, 2500);
      }, resta);
    }

    function iniciar() {
      // Tempo já acabou → preto para sempre
      if (ler(CHAVE_FIM)) { encerrar(); return; }

      // Já entrou antes e ainda está no prazo → abre a carta direto,
      // sem perguntar de novo (recarregar ou fechar sem querer não zera o tempo)
      const inicioSalvo = Number(ler(CHAVE_INICIO));
      if (inicioSalvo) {
        if (Date.now() - inicioSalvo >= DURACAO_MS) { encerrar(); return; }
        abrirCarta(inicioSalvo);
        return;
      }

      // Primeira vez → pergunta
      const pergunta = document.getElementById('pergunta');
      const form     = document.getElementById('form-pergunta');
      const campo    = document.getElementById('resposta');
      const erro     = document.getElementById('pergunta-erro');

      pergunta.hidden = false;
      campo.focus();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (normalizar(campo.value) === RESPOSTA_CERTA) {
          const agora = Date.now();
          gravar(CHAVE_INICIO, String(agora));
          abrirCarta(agora);
        } else {
          erro.textContent = 'Hmm… não foi esse. Tenta de novo.';
          form.classList.remove('errou');
          void form.offsetWidth; // reinicia a animação de tremer
          form.classList.add('errou');
          campo.select();
        }
      });
    }

    iniciar();
  </script>
