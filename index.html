<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Duas cartas, escritas em momentos diferentes." />
  <title>Para você</title>
  <style>
    /* ── Paleta pôr do sol ── */
    :root {
      --fundo:        #0f0b07;
      --fundo-card:   #1c140b;
      --entardecer:   #2a1a08;
      --sol:          #f5b83d;
      --sol-claro:    #ffd27a;
      --brasa:        #f08a2c;
      --texto:        #f5ead8;
      --texto-suave:  #c9b69a;
      --fonte-titulo: 'Georgia', 'Times New Roman', serif;
      --fonte-corpo:  'Helvetica Neue', 'Arial', sans-serif;
      --raio:         10px;
      --transicao:    0.35s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--fundo);
      color: var(--texto);
      font-family: var(--fonte-corpo);
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--sol); outline-offset: 3px; }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ══════════════════════════════════════════════════════
       ESCOLHA — tela inicial
    ══════════════════════════════════════════════════════ */
    .escolha {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
      /* sol se pondo na base da tela */
      background:
        radial-gradient(ellipse 120% 55% at 50% 100%, rgba(245,150,40,0.38) 0%, rgba(150,75,10,0.22) 45%, transparent 75%),
        linear-gradient(to bottom, var(--fundo) 0%, var(--entardecer) 100%);
    }
    .escolha-conteudo {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .escolha-conteudo > * {
      opacity: 0;
      animation: surgir 0.8s ease forwards;
    }
    .escolha-conteudo > :nth-child(2) { animation-delay: 0.3s; }
    .escolha-conteudo > :nth-child(3) { animation-delay: 0.6s; }
    .escolha-conteudo > :nth-child(4) { animation-delay: 0.9s; }
    .escolha-conteudo > :nth-child(5) { animation-delay: 1.3s; }

    .escolha-coracao {
      font-size: 2.6rem;
      line-height: 1;
      color: var(--sol);
      text-shadow: 0 0 24px rgba(245,184,61,0.55);
      margin-bottom: 24px;
    }
    .escolha-conteudo > .escolha-coracao {
      animation: surgir 0.8s ease forwards, batida 1.6s ease-in-out 0.8s infinite;
    }
    @keyframes batida {
      0%, 100% { transform: scale(1); }
      15%      { transform: scale(1.18); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.1); }
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--sol);
      margin-bottom: 16px;
    }
    .escolha-titulo {
      font-family: var(--fonte-titulo);
      font-size: clamp(1.8rem, 7vw, 2.8rem);
      font-weight: 400;
      line-height: 1.2;
      color: #fff;
      margin-bottom: 14px;
    }
    .escolha-texto {
      font-size: 0.95rem;
      color: var(--texto-suave);
      max-width: 400px;
      margin-bottom: 36px;
    }

    /* Os dois cards */
    .escolha-opcoes {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .opcao-carta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 22px 22px 20px;
      text-align: left;
      background: rgba(28,20,11,0.85);
      border: 1px solid rgba(245,184,61,0.22);
      border-radius: var(--raio);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      transition: transform var(--transicao), border-color var(--transicao), background var(--transicao);
    }
    .opcao-carta:hover {
      transform: translateY(-4px);
      border-color: rgba(245,184,61,0.6);
      background: rgba(40,28,13,0.95);
    }
    .opcao-carta:active { transform: scale(0.98); }

    .opcao-rotulo {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--texto-suave);
    }
    .opcao-titulo {
      font-family: var(--fonte-titulo);
      font-size: 1.35rem;
      font-weight: 400;
      color: #fff;
    }
    .opcao-desc {
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--texto-suave);
    }
    .opcao-acao {
      margin-top: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sol);
    }
    .opcao-acao::after { content: ' →'; }

    /* Carta nova em destaque — dourado do sol */
    .opcao-carta.nova {
      background: linear-gradient(145deg, rgba(120,70,12,0.75) 0%, rgba(28,20,11,0.9) 100%);
      border-color: rgba(245,184,61,0.5);
    }
    .opcao-carta.nova .opcao-rotulo { color: var(--sol-claro); }

    .escolha-dica {
      margin-top: 26px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(201,182,154,0.55);
    }

    @media (min-width: 640px) {
      .escolha-opcoes { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <main class="escolha">
    <div class="escolha-conteudo">
      <div class="escolha-coracao" aria-hidden="true">♥</div>
      <span class="eyebrow">Para você</span>
      <h1 class="escolha-titulo">Duas cartas,<br>dois momentos</h1>
      <p class="escolha-texto">
        Uma foi escrita antes, outra agora.
        Escolha por onde quer começar.
      </p>

      <nav class="escolha-opcoes" aria-label="Escolha uma carta">
        <!-- Leva para a Retrospectiva atual -->
        <a href="carta-antiga.html" class="opcao-carta">
          <span class="opcao-rotulo">Carta antiga</span>
          <span class="opcao-titulo">Nossa Retrospectiva</span>
          <span class="opcao-desc">As fotos, os capítulos e a primeira carta que escrevi.</span>
          <span class="opcao-acao">Abrir</span>
        </a>

        <!-- Leva para a carta nova (só pode ser lida uma vez, por 10 min) -->
        <a href="carta-nova.html" class="opcao-carta nova">
          <span class="opcao-rotulo">Carta nova</span>
          <span class="opcao-titulo">O que eu sinto hoje</span>
          <span class="opcao-desc">Escrita agora, com o que eu aprendi desde então.</span>
          <span class="opcao-acao">Abrir</span>
        </a>
      </nav>
    </div>
  </main>

</body>
</html>
