<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Para você</title>
  <style>
    /* ── Paleta pôr do sol (mesma do index.html) ── */
    :root {
      --cor-fundo: #0f0b07;
      --cor-entardecer: #2a1a08;
      --cor-sol-claro: #ffd27a;
      --cor-texto: #f5ead8;
      --cor-texto-suave: #c9b69a;
      --cor-destaque: #f5b83d;
      --ceu-por-do-sol:
        radial-gradient(ellipse 120% 55% at 50% 100%, rgba(245,150,40,0.38) 0%, rgba(150,75,10,0.22) 45%, transparent 75%),
        linear-gradient(to bottom, var(--cor-fundo) 0%, var(--cor-entardecer) 100%);
      --fonte-titulo: 'Georgia', 'Times New Roman', serif;
      --fonte-corpo: 'Helvetica Neue', 'Arial', sans-serif;
      --raio: 10px;
      --transicao: 0.35s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: var(--fonte-corpo);
      line-height: 1.7;
    }
    [hidden] { display: none !important; }

    @keyframes surgir {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cor-destaque);
      margin-bottom: 16px;
    }

    /* Link discreto para a carta antiga */
    .link-antiga {
      display: inline-block;
      margin-top: 22px;
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      color: var(--cor-texto-suave);
      text-decoration: none;
      border-bottom: 1px solid rgba(245,184,61,0.35);
      padding-bottom: 2px;
      transition: color var(--transicao), border-color var(--transicao);
    }
    .link-antiga:hover { color: var(--cor-sol-claro); border-color: var(--cor-sol-claro); }
    .link-antiga::before { content: '← '; }

    /* ══════════ CARTA ══════════ */
    #carta {
      min-height: 100svh;
      padding: 72px 22px 96px;
      background:
        radial-gradient(ellipse 140% 380px at 50% 0%, rgba(245,150,40,0.22) 0%, transparent 70%),
        var(--cor-fundo);
    }
    .carta-rodape {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid rgba(245,184,61,0.18);
    }
    .carta-inner {
      max-width: 620px;
      margin: 0 auto;
      animation: surgir 1s ease forwards;
    }
    .carta-titulo {
      font-family: var(--fonte-titulo);
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 400;
      line-height: 1.25;
      color: #fff;
      margin-bottom: 28px;
    }
    .carta-texto {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--cor-texto-suave);
    }
    .carta-texto p + p { margin-top: 18px; }
    .carta-texto strong { color: var(--cor-texto); font-weight: 600; }
  </style>
</head>
<body>

  <!-- A pergunta do carbonara fica no index.html.
       Quem abrir esta página sem ter respondido volta para lá. -->
  <div id="carta" hidden></div>

  <!-- ★ TEXTO DA CARTA -->
  <template id="conteudo-carta">
    <article class="carta-inner">
      <span class="eyebrow">Carta nova</span>

      <div class="carta-texto">
        <p>Letícia,</p>

        <p>Se você chegou até aqui, significa que esse QR Code sobreviveu mais do que eu imaginava.</p>

        <p>Escrevo isso no dia em que completaríamos um ano de namoro.</p>

        <p>Faz bastante tempo desde que tudo aconteceu. Tempo suficiente para muita coisa mudar, inclusive eu.</p>

        <p>Não escrevo isso esperando resposta, explicação ou reencontro. Acho que algumas perguntas simplesmente perderam a importância que pareciam ter naquela época.</p>

        <p>Queria apenas deixar registrado algo que talvez eu nunca diga em voz alta.</p>

        <p>Apesar de tudo que aconteceu, eu não levo raiva de você.</p>

        <p>Durante muito tempo tentei entender o que deu errado, quem tinha razão e o que poderia ter sido diferente. Hoje isso já não importa tanto.</p>

        <p>O que ficou foram as lembranças.</p>

        <p>Algumas felizes, algumas dolorosas, mas todas parte de uma história que foi muito importante para mim.</p>

        <p>Ainda tenho curiosidade sobre pequenas coisas que provavelmente nunca vou saber. Como foi sua primeira romaria andando, por exemplo.</p>

        <p>E tudo bem.</p>

        <p>A vida segue para todo mundo.</p>

        <p>Também preciso admitir uma coisa que provavelmente não faria sentido dizer naquela época: no aniversário da Rafa, você estava muito linda.</p>

        <p>Talvez porque o tempo tenha passado, talvez porque já não exista nada a provar.</p>

        <p>Obrigado pelos 456 dias.</p>

        <p>Pelas viagens, pelas conversas, pelas risadas, pelas discussões, pelas conquistas e por todos os momentos que fizeram parte da nossa história.</p>

        <p>Você foi uma parte importante da minha vida e da pessoa que me tornei.</p>

        <p>Espero que a vida tenha sido gentil com você, com sua família, com a Manu e com a Bela.</p>

        <p>Se um dia você ler isso, espero que esteja feliz.</p>

        <p>Cuide-se.</p>

        <p><strong>Jô</strong></p>
      </div>

      <div class="carta-rodape">
        <a href="carta-antiga.html" class="link-antiga">Ver a carta antiga</a>
      </div>
    </article>
  </template>

  <script>
    'use strict';

    // Gravada pelo index.html quando ela acerta "carbonara"
    const CHAVE_RESPONDEU = 'cartas.respondeu';

    function respondeu() {
      try { return localStorage.getItem(CHAVE_RESPONDEU) === '1'; }
      catch (e) { return true; } // sem acesso ao armazenamento: mostra a carta
    }

    if (!respondeu()) {
      location.replace('index.html');
    } else {
      const carta = document.getElementById('carta');
      carta.appendChild(document.getElementById('conteudo-carta').content.cloneNode(true));
      carta.hidden = false;
    }
  </script>
</body>
</html>
